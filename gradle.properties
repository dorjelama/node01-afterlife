org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# NODE's one library, MediaPipe, brings androidx.annotation with it, so AndroidX
# must be on. NODE itself still uses no AndroidX, AppCompat or Material.
android.useAndroidX=true
android.enableJetifier=false

# Skip generating BuildConfig/resource classes we do not consume.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

kotlin.code.style=official
