org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# NODE deliberately uses zero third-party libraries -- no AndroidX, no AppCompat,
# no Material. Turning Jetifier/AndroidX on would only add weight we never use.
android.useAndroidX=false
android.enableJetifier=false

# Skip generating BuildConfig/resource classes we do not consume.
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=true

kotlin.code.style=official
